[project]
name = "travel-video-editor"
version = "0.1.0"
description = "Local-first, token-efficient travel video indexing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=11.0",
]

[project.scripts]
travel-video = "travel_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travel_video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
